name: Build

on:
  push:
    branches:
    - main
    paths-ignore:
    - ".github/**"
  pull_request:
    branches:
    - main
    paths-ignore:
    - ".github/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6.0.1
      with:
        distribution: "temurin"
        java-version: "25"
        cache: "gradle"

    - name: Build
      run: ./gradlew build
